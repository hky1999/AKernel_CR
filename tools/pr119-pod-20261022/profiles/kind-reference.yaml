{
  "kind": "Cluster",
  "apiVersion": "kind.x-k8s.io/v1alpha4",
  "name": "akcr119-20261022",
  "networking": {
    "ipFamily": "ipv4",
    "apiServerAddress": "127.0.0.1",
    "apiServerPort": 19443,
    "podSubnet": "10.220.0.0/16",
    "serviceSubnet": "10.210.0.0/16",
    "disableDefaultCNI": true,
    "kubeProxyMode": "nftables"
  },
  "nodes": [
    {
      "role": "control-plane",
      "labels": {
        "akernel.dev/role": "control",
        "akernel.dev/instance": "control"
      },
      "extraMounts": [
        {
          "hostPath": "@TASK_ROOT@/node-data09/control/akernel",
          "containerPath": "/home/akernel",
          "propagation": "HostToContainer"
        },
        {
          "hostPath": "@TASK_ROOT@/node-data09/control/volumes",
          "containerPath": "/var/local-path-provisioner",
          "propagation": "HostToContainer"
        },
        {
          "hostPath": "@TASK_ROOT@/node-data09/control/rook",
          "containerPath": "/var/lib/akernel-pr119-storage/rook",
          "propagation": "HostToContainer"
        },
        {
          "hostPath": "/dev/kvm",
          "containerPath": "/dev/kvm"
        },
        {
          "hostPath": "/dev/fuse",
          "containerPath": "/dev/fuse"
        },
        {
          "hostPath": "/dev/net/tun",
          "containerPath": "/dev/net/tun"
        }
      ]
    },
    {
      "role": "worker",
      "labels": {
        "akernel.dev/role": "execution",
        "akernel.dev/instance": "a"
      },
      "extraMounts": [
        {
          "hostPath": "@TASK_ROOT@/node-data09/a/akernel",
          "containerPath": "/home/akernel",
          "propagation": "HostToContainer"
        },
        {
          "hostPath": "@TASK_ROOT@/node-data09/a/volumes",
          "containerPath": "/var/local-path-provisioner",
          "propagation": "HostToContainer"
        },
        {
          "hostPath": "@TASK_ROOT@/node-data09/a/rook",
          "containerPath": "/var/lib/akernel-pr119-storage/rook",
          "propagation": "HostToContainer"
        },
        {
          "hostPath": "/dev/kvm",
          "containerPath": "/dev/kvm"
        },
        {
          "hostPath": "/dev/fuse",
          "containerPath": "/dev/fuse"
        },
        {
          "hostPath": "/dev/net/tun",
          "containerPath": "/dev/net/tun"
        }
      ]
    },
    {
      "role": "worker",
      "labels": {
        "akernel.dev/role": "execution",
        "akernel.dev/instance": "b"
      },
      "extraMounts": [
        {
          "hostPath": "@TASK_ROOT@/node-data09/b/akernel",
          "containerPath": "/home/akernel",
          "propagation": "HostToContainer"
        },
        {
          "hostPath": "@TASK_ROOT@/node-data09/b/volumes",
          "containerPath": "/var/local-path-provisioner",
          "propagation": "HostToContainer"
        },
        {
          "hostPath": "@TASK_ROOT@/node-data09/b/rook",
          "containerPath": "/var/lib/akernel-pr119-storage/rook",
          "propagation": "HostToContainer"
        },
        {
          "hostPath": "/dev/kvm",
          "containerPath": "/dev/kvm"
        },
        {
          "hostPath": "/dev/fuse",
          "containerPath": "/dev/fuse"
        },
        {
          "hostPath": "/dev/net/tun",
          "containerPath": "/dev/net/tun"
        }
      ]
    }
  ],
  "kubeadmConfigPatches": [
    "kind: KubeletConfiguration\nmaxPods: 32\nkubeReserved:\n  cpu: \"100\"\n  memory: \"@KUBE_RESERVED_MEMORY_BYTES@\"\n  ephemeral-storage: \"@KUBE_RESERVED_STORAGE_BYTES@\"\nevictionHard:\n  memory.available: 100Mi\n  nodefs.available: 1Gi\n  imagefs.available: 1Gi\n"
  ]
}
